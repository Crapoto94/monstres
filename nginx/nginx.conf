# Reverse proxy de façade — déploiement Proxmox uniquement.
# L'API et les photos sont exposées sur des chemins (/api/, /uploads/)
# plutôt que des sous-domaines dédiés (api.monstres.fbc.fr,
# img.monstres.fbc.fr) — simplification V1 (voir PROGRESS.md). TLS non géré
# ici : à terminer en amont (certbot ou reverse proxy déjà en place sur le
# Proxmox) avant mise en production.
#
# DOMAINE CANONIQUE : monstres.app. Les autres domaines (monstres.fbc.fr…)
# redirigent en 301 vers lui. Avant ce choix, les deux servaient le même
# site en 200 : Google y voyait deux sites identiques et répartissait les
# signaux de référencement entre les deux au lieu de les cumuler.
#
# TODO : si api./img. sont ajoutés en DNS plus tard, on peut revenir à des
# server{} séparés par sous-domaine (voir historique git) sans changer les
# services backend/frontend/storage eux-mêmes.

# Robots qui n'exécutent pas le JS de la SPA et ne verraient donc aucune
# donnée par Monstre sur /monstres/:id :
#  - robots de partage (Facebook, WhatsApp…) : ont besoin des balises Open Graph ;
#  - moteurs de recherche : ont besoin d'un contenu réel à indexer.
# Ces User-Agent sont routés vers le backend (ShareController), qui leur sert
# la même page en HTML statique. Tout le reste (vrais visiteurs) va au
# frontend Vue normal.
map $http_user_agent $monstres_upstream {
    default "http://frontend:80";
    "~*facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|Discordbot|SkypeUriPreview|Pinterest" "http://backend:3000";
    "~*Googlebot|Google-InspectionTool|Storebot-Google|Bingbot|DuckDuckBot|Applebot|YandexBot|Baiduspider|Qwantify" "http://backend:3000";
}

# Domaines secondaires → redirection permanente vers le domaine canonique.
server {
    listen 80;
    server_name monstres.fbc.fr www.monstres.fbc.fr www.monstres.app;

    return 301 https://monstres.app$request_uri;
}

server {
    listen 80;
    server_name monstres.app;

    # Limite par défaut de nginx = 1 Mo, trop faible pour l'upload de photos
    # (jusqu'à 3 photos × 5 Mo, voir §7 et MAX_FILE_SIZE_BYTES côté backend).
    client_max_body_size 16m;

    # robots.txt et sitemap.xml : servis par le backend (SeoController), car
    # le sitemap doit lister les Monstres visibles du moment. Sans ces deux
    # règles, le fallback SPA du frontend les renvoyait en index.html avec un
    # code 200 — Google recevait du HTML au lieu du texte/XML attendu.
    location = /robots.txt {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Page « C'est quoi, un Monstre ? » : même routage par User-Agent. C'est
    # la page qui porte les explications du projet, donc celle qu'on veut
    # voir indexée correctement — les moteurs reçoivent le texte directement
    # dans le HTML plutôt que d'avoir à exécuter le JS de la SPA.
    location = /pourquoi {
        proxy_pass $monstres_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fiche Monstre : routée dynamiquement frontend/backend selon le User-Agent
    # (voir map $monstres_upstream ci-dessus). Doit être déclarée avant le
    # `location /` générique pour être prioritaire.
    location ~ ^/monstres/ {
        proxy_pass $monstres_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API NestJS — préfixe /api/v1 déjà géré côté backend, on transmet tel quel.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photos (§7, §12.8) — servies par le conteneur `storage` depuis le
    # volume partagé avec le backend. Le préfixe /uploads/ est retiré avant
    # transmission (trailing slash sur proxy_pass).
    location /uploads/ {
        proxy_pass http://storage:80/;
        proxy_set_header Host $host;
    }

    # Frontend PWA (tout le reste).
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
