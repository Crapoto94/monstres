# Sert la PWA buildée avec fallback SPA (routes gérées par Vue Router).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker, son registre et le shell de la SPA ne doivent jamais
    # être mis en cache par le navigateur : sinon un appareil resté sur une
    # ancienne version garde indéfiniment l'ancienne interface (le navigateur
    # ne revalide même pas un sw.js « frais » selon son Cache-Control).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Les fichiers buildés (nom = hash de contenu) sont immuables.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
